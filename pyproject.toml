[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superpod-compute-model"
version = "0.1.0"
description = "Independent single-GPU tiling, resource and pipeline model"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
superpod-compute = "superpod_compute.cli:main"

[tool.setuptools.packages.find]
include = ["superpod_compute*"]

[tool.setuptools.package-data]
superpod_compute = ["data/*.csv", "data/*.json"]
